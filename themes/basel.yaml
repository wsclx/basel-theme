# Basel: a Home Assistant theme in the International Typographic Style, with light and dark mode in one theme.
#
# Near-white paper, one signal red and black. A neo-grotesque system sans set tight and flush left, square corners,
# no shadows; cards are separated by the grid gap and a thin black rule along their top edge. Switched-on states,
# heating, alarms, errors and the selected entry are red; buttons, links and calm states are black; off is grey.
# Dark mode is white and red on deep black-grey, derived separately rather than inverted.
#
# Works without any add-on: colours, rules, corners, font stack, bold tile names and bold headings come from
# plain theme variables. With card-mod 4.x installed (optional), the card-mod-* keys below turn tiles of
# switched-on devices into solid red tiles with white text, set big numbers (entity, sensor,
# weather) large and bold, put a heavier black rule, capitals and a running number on heading cards, set the
# thermostat title flush left, draw a 2 px focus ring around tiles, enlarge the dashboard title and mark the
# selected sidebar entry as a red bar. Without card-mod those keys are ignored.
#
# Fonts: system fonts only, nothing is downloaded. Helvetica Neue on Apple devices, Arial on Windows,
# Nimbus Sans or Liberation Sans on Linux, the system sans (Roboto) on Android.
Basel:
  card-mod-theme: Basel

  # Theme-own variables, used below and by the card-mod rules
  basel-red: "#da0b16"
  basel-on-red: "#ffffff"
  basel-ink: "#111111"
  basel-rule: "#111111"
  basel-sans: "'Helvetica Neue', Helvetica, Arial, 'Nimbus Sans', Arimo, 'Liberation Sans', system-ui, sans-serif"

  # Core colours: actions in ink, red only for states, selection and alerts
  primary-color: "#111111"
  accent-color: "#da0b16"
  text-primary-color: "#ffffff"
  primary-text-color: "#111111"
  secondary-text-color: "#555555"
  disabled-text-color: "#8c8c8c"
  disabled-color: "#8c8c8c"
  dark-primary-color: "#000000"
  light-primary-color: "#e3e3e3"
  # Newer frontends build buttons, chips, switches, alerts and borders from these scales.
  # Primary is ink (buttons, links, tabs), red is the one signal red (errors, alarms). Orange (warning) sets
  # black on pale red, green (success) black and grey, so no third hue appears. The neutral scale stays default.
  ha-color-primary-05: "#0a0a0a"
  ha-color-primary-10: "#141414"
  ha-color-primary-20: "#1f1f1f"
  ha-color-primary-30: "#333333"
  ha-color-primary-40: "#111111"
  ha-color-primary-50: "#3d3d3d"
  ha-color-primary-60: "#5c5c5c"
  ha-color-primary-70: "#8c8c8c"
  ha-color-primary-80: "#bdbdbd"
  ha-color-primary-90: "#e3e3e3"
  ha-color-primary-95: "#f0f0f0"
  ha-color-red-05: "#1f0203"
  ha-color-red-10: "#3a0306"
  ha-color-red-20: "#5e050b"
  ha-color-red-30: "#b0080f"
  ha-color-red-40: "#da0b16"
  ha-color-red-50: "#c00a14"
  ha-color-red-60: "#e8434a"
  ha-color-red-70: "#f07a7f"
  ha-color-red-80: "#f7b3b5"
  ha-color-red-90: "#fdeeee"
  ha-color-red-95: "#fef6f6"
  ha-color-orange-05: "#0a0a0a"
  ha-color-orange-10: "#141414"
  ha-color-orange-20: "#1f1f1f"
  ha-color-orange-30: "#000000"
  ha-color-orange-40: "#111111"
  ha-color-orange-50: "#3d3d3d"
  ha-color-orange-60: "#5c5c5c"
  ha-color-orange-70: "#8c8c8c"
  ha-color-orange-80: "#f7b3b5"
  ha-color-orange-90: "#fdeeee"
  ha-color-orange-95: "#fef6f6"
  ha-color-green-05: "#0a0a0a"
  ha-color-green-10: "#141414"
  ha-color-green-20: "#1f1f1f"
  ha-color-green-30: "#000000"
  ha-color-green-40: "#111111"
  ha-color-green-50: "#3d3d3d"
  ha-color-green-60: "#5c5c5c"
  ha-color-green-70: "#8c8c8c"
  ha-color-green-80: "#bdbdbd"
  ha-color-green-90: "#e3e3e3"
  ha-color-green-95: "#f0f0f0"
  ha-color-focus: "#111111"

  # Paper
  primary-background-color: "#f1f1f1"
  secondary-background-color: "#e8e8e8"
  lovelace-background: "#f1f1f1"
  clear-background-color: "#fcfcfc"

  # Cards: near-white, square, flat, a thin black rule along the top edge instead of a frame
  card-background-color: "#fcfcfc"
  ha-card-background: "#fcfcfc"
  ha-card-border-width: "0"
  ha-card-border-color: "transparent"
  ha-card-border-radius: "0"
  ha-card-box-shadow: "inset 0 2px 0 var(--basel-rule)"
  divider-color: "#d4d4d4"
  ha-color-border-neutral-quiet: "#d4d4d4"
  outline-color: "#8c8c8c"
  outline-hover-color: "#111111"
  # A wider gap between cards carries the grid
  ha-section-grid-column-gap: "12px"
  ha-section-grid-row-gap: "12px"

  # Square corners everywhere; switches and round icons keep their shape (fixed in the frontend)
  ha-border-radius-sm: "0"
  ha-border-radius-md: "0"
  ha-border-radius-lg: "0"
  ha-border-radius-xl: "0"
  ha-border-radius-2xl: "0"
  ha-border-radius-3xl: "0"
  ha-border-radius-4xl: "0"
  ha-border-radius-6xl: "0"
  ha-border-radius-pill: "0"
  ha-tile-icon-border-radius: "0"
  ha-badge-border-radius: "0"
  control-slider-border-radius: "0"
  control-button-border-radius: "0"
  feature-border-radius: "0"
  ha-dialog-border-radius: "0"
  mdc-shape-small: "0"
  mdc-shape-medium: "0"
  mdc-shape-large: "0"

  # No shadows
  ha-box-shadow-s: "none"
  ha-box-shadow-m: "none"
  ha-box-shadow-l: "none"
  dialog-box-shadow: "none"
  ha-tooltip-box-shadow: "none"

  # Dialogs
  ha-dialog-surface-background: "#fcfcfc"
  mdc-theme-surface: "#fcfcfc"
  mdc-dialog-scrim-color: "rgba(17,17,17,.5)"
  paper-dialog-background-color: "#fcfcfc"

  # Header and sidebar
  app-header-background-color: "#f1f1f1"
  app-header-text-color: "#111111"
  app-header-border-bottom: "2px solid #111111"
  sidebar-background-color: "#fcfcfc"
  sidebar-text-color: "#111111"
  sidebar-icon-color: "#111111"
  # The frontend tints the selected entry with its own text colour at 12 %; a darker red keeps 4.5:1 there
  sidebar-selected-text-color: "#a8070f"
  sidebar-selected-icon-color: "#a8070f"
  sidebar-menu-button-text-color: "#111111"

  # Inputs and forms
  input-fill-color: "#fcfcfc"
  input-ink-color: "#111111"
  input-label-ink-color: "#555555"
  input-idle-line-color: "#111111"
  input-hover-line-color: "#111111"
  input-outlined-idle-border-color: "#8c8c8c"
  input-outlined-hover-border-color: "#111111"
  input-disabled-ink-color: "#8c8c8c"
  input-disabled-line-color: "#bdbdbd"
  input-dropdown-icon-color: "#111111"
  mdc-text-field-fill-color: "#fcfcfc"
  mdc-select-fill-color: "#fcfcfc"
  ha-color-form-background: "#fcfcfc"
  code-editor-background-color: "#fcfcfc"
  markdown-code-background-color: "#e8e8e8"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "#da0b16"
  switch-unchecked-button-color: "#111111"
  switch-unchecked-track-color: "#8c8c8c"
  ha-switch-checked-background-color: "#da0b16"
  ha-switch-checked-border-color: "#da0b16"
  ha-switch-checked-thumb-background-color: "#ffffff"
  ha-switch-checked-thumb-border-color: "#ffffff"
  scrollbar-thumb-color: "#8c8c8c"

  # Sliders and rings
  control-slider-color: "#da0b16"
  control-slider-background: "#d4d4d4"
  control-slider-background-opacity: "1"
  control-circular-slider-color: "#da0b16"
  control-circular-slider-background: "#111111"
  control-circular-slider-background-opacity: ".15"
  control-switch-on-color: "#da0b16"
  control-switch-off-color: "#bdbdbd"

  # Typography: one neo-grotesque, bold names and headings, set tight
  ha-font-family-body: "var(--basel-sans)"
  ha-font-family-heading: "var(--basel-sans)"
  ha-card-header-font-family: "var(--basel-sans)"
  ha-font-family-code: "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
  code-font-family: "ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
  ha-font-weight-heading: "700"
  ha-tile-info-primary-font-weight: "700"
  ha-tile-info-primary-letter-spacing: "-0.01em"
  ha-tile-info-secondary-letter-spacing: "0"
  ha-heading-card-title-font-weight: "700"
  ha-heading-card-title-font-size: "15px"
  ha-card-header-font-size: "20px"

  # States: on, heating, lit, alarm and other strong states are red; calm states black; off is grey.
  # The palette below feeds every state colour of the frontend, so nothing falls back to another hue.
  state-icon-color: "#111111"
  state-active-color: "#da0b16"
  state-inactive-color: "#8c8c8c"
  state-unavailable-color: "#bdbdbd"
