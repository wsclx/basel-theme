  black-color: "#111111"
  dark-grey-color: "#3d3d3d"
  grey-color: "#8c8c8c"
  blue-grey-color: "#8c8c8c"
  light-grey-color: "#bdbdbd"
  white-color: "#ffffff"
  # Graphs: red first, then black and greys
  graph-color-1: "#da0b16"
  graph-color-2: "#111111"
  graph-color-3: "#8c8c8c"
  graph-color-4: "#5c5c5c"
  graph-color-5: "#bdbdbd"
  energy-solar-color: "#da0b16"
  energy-grid-consumption-color: "#111111"
  energy-grid-return-color: "#8c8c8c"
  energy-battery-in-color: "#5c5c5c"
  energy-battery-out-color: "#bdbdbd"
  energy-non-fossil-color: "#5c5c5c"
  energy-gas-color: "#3d3d3d"
  energy-water-color: "#8c8c8c"
  # Weather icons: black sun and rain, grey clouds
  weather-icon-sun-color: "#111111"
  weather-icon-moon-color: "#111111"
  weather-icon-rain-color: "#111111"
  weather-icon-cloud-front-color: "#d4d4d4"
  weather-icon-cloud-back-color: "#8c8c8c"

  # Optional, card-mod 4.x: tiles of switchable entities that are on become a solid red tile with white text.
  # The domain list matters: the tile card marks any entity with a value as active, sensors included.
  # Big numbers of entity, sensor and weather cards large and bold, heading cards with a heavier rule and capitals.
  card-mod-card: |
    ha-card.active:has(ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=automation], [data-domain=script], [data-domain=cover])) {
      --ha-card-background: var(--basel-red);
      background: var(--basel-red);
      --tile-color: var(--basel-on-red) !important;
      --primary-text-color: var(--basel-on-red);
      --secondary-text-color: var(--basel-on-red);
      --control-slider-background: var(--basel-on-red);
    }
    ha-card:has(ha-tile-container[focused]) { box-shadow: var(--ha-card-box-shadow), 0 0 0 2px var(--ha-color-focus) !important; }
    :host(hui-entity-card) .value, :host(hui-sensor-card) .value { font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    :host(hui-weather-forecast-card) .temp-attribute .temp { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    :host(hui-heading-card) ha-card { box-shadow: inset 0 4px 0 var(--basel-rule); padding-top: 12px; }
    :host(hui-heading-card) .title .heading { text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; }
    :host(hui-heading-card) { counter-increment: basel-section; }
    :host(hui-heading-card) .title .heading::before { content: counter(basel-section, decimal-leading-zero); display: inline-block; min-width: 3em; letter-spacing: 0; }
    :host(hui-thermostat-card) .title { text-align: start; }
  # Optional, card-mod 4.x: badges of coloured lights in red instead of the light colour
  card-mod-badge: |
    ha-badge[style*="--badge-color:#"], ha-badge[style*="--badge-color:rgb"] { --badge-color: var(--state-light-active-color) !important; }
  # Optional, card-mod 4.x: the dashboard title large and bold
  card-mod-root: |
    .main-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    #view { counter-reset: basel-section; }
  # Optional, card-mod 4.x: sidebar in the theme font, selected entry as a solid red bar
  card-mod-sidebar: |
    :host { font-family: var(--basel-sans); }
    ha-list-item-button.selected {
      background: var(--basel-red);
      --sidebar-selected-text-color: var(--basel-on-red);
      --sidebar-selected-icon-color: var(--basel-on-red);
    }
    ha-list-item-button.selected::before { opacity: 0 !important; }

